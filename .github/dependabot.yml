version: 2

updates:
  # The SDK is a dependency here, so this is how SDK releases reach the template: npm publishes,
  # Dependabot opens a pull request, and CI decides whether it is safe.
  #
  # That CI run is the point. `npm run verify` runs the parity check against node_modules/@pixelkit-labs/sdk,
  # so a hook the new SDK exports with nowhere to try it in this app FAILS the pull request. A new
  # capability cannot land here silently undemonstrated - it lands as a red build with the hook
  # named.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    groups:
      # The three publish in lockstep and @pixelkit-labs/sdk pins the other two exactly, so they must move
      # together. Ungrouped, Dependabot would open three pull requests for one release and two of
      # them would fail to resolve.
      pixelkit:
        patterns:
          - '@pixelkit-labs/*'
    ignore:
      # Expo SDK packages are tightly coupled to the Expo SDK release (SDK 57).
      # Major upgrades (e.g. 57 -> 58) must be done across the entire project in unison,
      # not package-by-package, to prevent npm peer dependency conflicts with the SDK.
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-major']
      # React and React Native are tightly pinned (React 19.2.3 with React Native 0.86.3).
      # react-dom and react must stay aligned; prevent out-of-band minor/major version bumps.
      - dependency-name: 'react'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    commit-message:
      prefix: deps
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
